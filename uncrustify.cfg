# Blister Format Style Options (uncrustify)
#
# Not autodetected by any editor/IDE - invoke explicitly, e.g.:
#   uncrustify -c uncrustify.cfg -l CPP --replace --no-backup <file>
#
# Kept in sync with .clang-format. Uncrustify's C++ parser and line-splitting
# are weaker than clang's, so a handful of constructs still come out wrong
# (heavy constexpr/template arithmetic, requires-expressions, hand-aligned
# data tables, sizeof with a leading space is fine but a few other spacing
# edge cases aren't distinguishable via config). As with clang-format, this
# isn't enforced in CI - keep new code consistent with surrounding code.

newlines                             = lf
input_tab_size                       = 8
output_tab_size                      = 8

# stdapi.h's short integer/char typedefs aren't recognized as types by
# uncrustify's built-in heuristics (unlike int/long/size_t or _t-suffixed
# names like msec_t), so a cast to one of these immediately followed by a
# unary operator - e.g. '(ulong)-1' - gets misparsed as a binary expression
# and spaced like one ('(ulong) - 1'). Declaring them here fixes that.
type ulong uint ushort uchar ullong llong wchar tchar tuchar byte word

#
# Indenting
#

indent_columns                       = 4
# 2 = indent AND align with tabs, using spaces once a tabstop is passed -
# reproduces the file's actual tab+space mix (tab per 8 cols, spaces for the
# remaining 4).
indent_with_tabs                     = 2
indent_switch_case                   = 0
indent_case_brace                    = 0
# Flat one-level continuation indent instead of aligning wrapped args/bool
# expressions under the opening '(' or '['.
indent_continue                      = 4
indent_align_paren                   = false
# Otherwise a statement written on the same line as a "case N:" label (or
# any other single-line lead-in) re-applies indent_continue on top of an
# implicit indent for the lead-in itself, double-indenting continuation
# lines instead of using the flat indent_continue level.
indent_ignore_first_continue         = true
# Without this, a wrapped 'return expr1 || expr2;' aligns the continuation
# under the first token after 'return' instead of using the flat
# indent_continue level.
indent_single_after_return           = true
# Without this, a wrapped template argument list (e.g. a multi-line
# 'using X = Y<...>') gets double-indented - indent_continue's level plus a
# second, separate level for the '<...>' nesting.
indent_template_param                = true
indent_func_call_param               = true
indent_func_def_param                = true
indent_func_proto_param              = true
# Without this, a lambda passed as a call argument re-applies
# indent_continue to its own closing '});', landing it under the lambda
# body instead of back under the line that opened the call.
indent_cpp_lambda_only_once          = true
indent_namespace                     = false
indent_class                         = true
# Absolute-column form (indent_access_spec>0) misplaces labels in nested
# classes; the "subtract N columns from the brace indent" form doesn't.
indent_access_spec                   = -4
# Otherwise a wrapped "func(...)\n    const {" lands flush with the
# signature instead of one level deeper.
indent_func_const                    = 4

# Backslash-continued macro bodies go through a separate indent path that
# ignores indent_continue/indent_with_tabs entirely (always one full tab per
# nesting level regardless of indent_columns), so leave them untouched.
disable_processing_nl_cont           = true

pp_indent                            = remove
pp_indent_at_level                   = false

#
# Blank lines
#

# Values are raw newline counts, not blank-line counts: 2 newlines = 1 blank
# line before public:/private:/protected: (never before the first one after
# '{', per docs). 0 = leave as written.
nl_before_access_spec                = 2
nl_after_access_spec                 = 0

#
# Braces: attach everywhere (K&R "same line"), never split empty bodies
#

nl_if_brace                          = remove
nl_for_brace                         = remove
nl_while_brace                       = remove
nl_do_brace                          = remove
nl_switch_brace                      = remove
nl_else_brace                        = remove
nl_brace_else                        = remove
nl_try_brace                         = remove
nl_catch_brace                       = remove
nl_brace_catch                       = remove
nl_class_brace                       = remove
nl_enum_brace                        = remove
nl_struct_brace                      = remove
nl_union_brace                       = remove
nl_namespace_brace                   = remove
nl_fdef_brace                        = remove
nl_fcall_brace                       = remove

nl_collapse_empty_body_functions     = true

# Don't split bodies that are already written as one-liners.
nl_class_leave_one_liners            = true
nl_func_leave_one_liners             = true
nl_getset_leave_one_liners           = true
nl_if_leave_one_liners               = true
nl_while_leave_one_liners            = true
nl_for_leave_one_liners              = true
nl_do_leave_one_liners               = true
nl_assign_leave_one_liners           = true
nl_enum_leave_one_liners             = true
nl_cpp_lambda_leave_one_liners       = true

#
# Spacing: control statements get "if (" / "for (", calls/decls don't
#

sp_before_sparen                     = force
sp_after_sparen                      = force
sp_sparen_brace                      = force
# NOT sp_func_call_paren=remove: also strips the space out of an unrelated
# member-function-pointer type used as a template argument, e.g.
# 'void (C::*LOCK)()' -> 'void(C::*LOCK)()' in Thread.h. Leaving this at
# its default (ignore) causes no regressions since existing calls already
# have no space before '('.
sp_func_def_paren                    = remove
sp_func_proto_paren                  = remove
sp_sizeof_paren                      = force
sp_after_operator                    = force
sp_after_cast                        = remove
sp_inside_paren_cast                 = remove
# NOT sp_cpp_cast_paren=remove: also strips the space from an unrelated
# array-reference parameter declarator like 'const T1 (&s)[N]', turning it
# into 'const T1(&s)[N]' - confirmed by bisection, no observed regression
# from leaving this at its default (ignore) instead.

# Pointer/reference stars attach to the name: "const tchar *key", not
# "const tchar* key" or "const tchar * key".
sp_before_ptr_star                   = force
# NOT sp_after_ptr_star=remove: somewhere past a certain amount of prior
# file content (root cause not isolated - confirmed via bisecting the whole
# config, not the source, since the bug disappears under plain defaults),
# forcing this misparses unrelated 'a ^ b'/'a * b' binary expressions
# elsewhere in the file as pointer-star declarators and strips their
# spacing too (e.g. stdapi.h's 'r0 ^ r1' -> 'r0 ^r1', 'a * b' -> 'a *b').
# Leaving this at its default (ignore) avoids that; existing code already
# has no space after '*', so this only stops enforcing it on new code.
sp_between_ptr_star                  = remove
sp_before_ptr_star_func              = force
sp_after_ptr_star_func               = remove

sp_template_angle                    = remove
sp_angle_word                        = force
sp_angle_paren                       = remove
sp_angle_paren_empty                 = remove
sp_after_angle                       = ignore
# Needed together to get 'vector<vector<int>>' instead of '... > >'.
sp_angle_shift                       = remove
sp_permit_cpp11_shift                = true
sp_inside_angle                      = remove
sp_before_angle                      = remove

# Keep 'args...'/'typename... T' tight; without this, a word immediately
# before '...' gets a forced space (e.g. 'args ...') in pack expansions and
# variadic template parameter lists.
sp_before_ellipsis                   = remove

sp_inside_paren                      = remove
sp_inside_square                     = remove
# NOT sp_inside_type_brace_init_lst/sp_after_type_brace_init_lst_open/
# sp_before_type_brace_init_lst_close = remove: uncrustify classifies a
# C++20 requires-expression's '{ ... }' the same way as a direct-list-init
# 'Type var{a, b}', so forcing those unspaced (to get 'cnt{0}' instead of
# 'cnt{ 0 }') also strips the space from 'requires { ... }' - and the two
# can't be told apart via any combination of these options. Chose to keep
# requires{ ... } spaced (13 occurrences) over unspacing direct-list-init
# (3 occurrences); the latter now reads 'cnt{ 0 }' like '= { a, b }'
# aggregate init does.
sp_inside_braces                     = force
sp_inside_braces_empty               = remove

sp_before_comma                      = remove
sp_after_comma                       = force
sp_before_case_colon                 = remove
sp_before_constr_colon               = remove
sp_before_class_colon                = remove
sp_after_class_colon                 = force

sp_assign                            = force
sp_arith                             = force
sp_bool                              = force
sp_compare                           = force

#
# Alignment - use tabs (not spaces) for macro-value and other non-indent
# alignment gaps, matching stdapi.h's tab-aligned #define blocks.
#

align_with_tabs                      = true
align_on_tabstop                     = true
align_keep_tabs                      = true
